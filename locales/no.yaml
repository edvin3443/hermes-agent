  dangerous_header: "⚠️  FARLIG KOMMANDO: {description}"
  choose_long:     "      [o]en gang  |  [s]esjon  |  [a]lltid  |  [d]nekt"
  choose_short:    "      [o]en gang  |  [s]esjon  |  [d]nekt"
  prompt_long:     "      Valg [o/s/a/D]: "
  prompt_short:    "      Valg [o/s/D]: "
  choose_smart_deny: "      [o]en gang  |  [d]nekt"
  prompt_smart_deny: "      Valg [o/D]: "
  # Godkjente inndata forbli på engelsk fordi kommandotolkeren hardkoder dem.
  smart_deny_once_inputs: "o,once"
  smart_deny_deny_inputs: "d,deny"
  timeout:         "      ⏱ Tidsavbrudd — nekter kommando"
  allowed_once:    "      ✓ Tillatt én gang"
  allowed_session: "      ✓ Tillatt for denne sesjonen"
  allowed_always:  "      ✓ Lagt til i permanent tillatelsesliste"
  denied:          "      ✗ Nektet"
  cancelled:       "      ✗ Avbrutt"
  blocklist_message: "Denne kommandoen står på den ubetingede blokkeringslisten og kan ikke godkjennes."

