# Hermes statisk-meldingskatalog -- Norsk (bokmål)
# See locales/en.yaml for the source of truth; keep keys in sync.
#
# Bare brukervendte statiske meldinger fra CLI-godkjenningsspørsmålet og en
# håndfull gateway-slash-kommandosvar bor her. Agentgenerert utdata, logglinjer,
# feiltracebacks, verktøyutdata og slash-kommandoers beskrivelser forblir på
# engelsk og oversettes IKKE -- se agent/i18n.py for begrunnelsen.
#
# Nøkler er punktbaner; innrykket nedenfor er kun for lesbarhet. Verdier kan
# inneholde {placeholder}-symboler for str.format-substitusjon. Ved nye nøkler,
# legg dem til i ALLE språkfiler i samme commit -- tests/agent/test_i18n.py
# krever katalogparitet. Godkjenningsinndata (o/s/a/D) er hardkodet i den
# engelske tolkeren og beholdes uendret nedenfor.

approval:
